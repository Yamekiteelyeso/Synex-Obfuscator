name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Install Luau CLI
        run: |
          curl -fsSL https://github.com/luau-lang/luau/releases/download/0.746/luau-ubuntu.zip -o /tmp/luau.zip
          echo "30f11c9cde8be2dc0e3066d210705532aac3726a2db89a6c5078080b6faa6cf8  /tmp/luau.zip" | sha256sum -c -
          mkdir -p /tmp/luau-cli
          unzip -q /tmp/luau.zip -d /tmp/luau-cli
          find /tmp/luau-cli -type f -name luau -exec install -m 0755 {} /usr/local/bin/luau \;
          test -x /usr/local/bin/luau

      - name: Test Luau cryptography modules
        run: luau packages/vm/luau/tests/crypto.test.lua
      - name: Test authenticated Luau VM substrate
        run: luau packages/vm/luau/tests/vm.test.lua
      - name: Test Luau compiler serialization
        run: luau packages/vm/luau/tests/compiler.test.lua
      - name: Test deterministic Luau build planner
        run: luau packages/vm/luau/tests/build.test.lua
      - name: Test Luau runtime wrapper
        run: luau packages/vm/luau/tests/runtime.test.lua
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Test engine and API
        run: npx tsx --test packages/parser/test/*.test.ts packages/semantic/test/*.test.ts packages/runtime/test/*.test.ts packages/transformations/test/*.test.ts packages/vm/test/*.test.ts packages/engine/test/*.test.ts apps/api/test/*.test.ts
      - name: Test web
        run: npx tsx --test apps/web/test/*.test.tsx
